<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>עדכון קושחה - בקר לחץ אוויר</title>  
  <link rel="stylesheet" type="text/css" href="common.css">
  <script type="text/javascript" src="update.js"></script>  
</head>

<body>
  <div class="container">
    <h1>עדכון קושחה</h1>
    <div class="card">
      <form id="upload_form" method='POST' action='/update' enctype='multipart/form-data' class="file-upload">
        <label for="update">בחר קובץ קושחה:</label>
        <div class="file-input-container">
          <input type="file" id="update" name="update" accept=".bin" onchange="sub(this)">
          <div id="file-input">לא נבחר קובץ</div>
        </div>
        <div id="error-message" class="error" style="display: none;"></div>
        <button type="submit" id="updateBtn" disabled>עדכן קושחה</button>
      </form>
      
      <div class="progress-container" id="progress-container">
        <div id="prgbar">
          <div id="bar"></div>
        </div>
        <div id="prg">מוכן להעלאה</div>
      </div>
    </div>
    <div class="nav-links">
      <a href="/">חזרה לתפריט</a>
    </div>
  </div>
</body>
</html>
